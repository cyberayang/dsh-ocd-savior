name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Syntax & JSON check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies are required to run the checks; the plugin has none.
      - name: Run checks
        run: node scripts/check.mjs
